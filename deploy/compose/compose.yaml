# Euron Open DBPilot: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env` (scripts/gen-local-env.sh).
# They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 5810   api 5830   mailpit 5825   mock model provider 5850
#   postgres 5842   redis 5879   floci 5866
#   demo databases DBPilot connects to: postgres 5843 (shop), mysql 5806 (people),
#   sqlserver 5807 (inventory), mongodb 5808 (catalog), redis 5809 (sessions)
name: dbpilot

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  DBPILOT_CLOUD: local
  LOG_LEVEL: ${DBPILOT_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://dbpilot:dbpilot@postgres:5432/dbpilot
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  WORK_DIR: /data/work
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${DBPILOT_WEB_PORT:-5810},http://127.0.0.1:${DBPILOT_WEB_PORT:-5810}
  PUBLIC_URL: http://localhost:${DBPILOT_WEB_PORT:-5810}
  AI_PROVIDER: openai
  AI_BASE_URL: http://mock-ai:5650/v1
  AI_API_KEY: mock-ai-key-not-for-production
  AI_MODEL: dbpilot-mock-sql
  DBPILOT_DEMO_PASSWORD: ${DBPILOT_DEMO_PASSWORD:?run `make env` first}
  DBPILOT_DEMO_READER_PASSWORD: ${DBPILOT_READER_PASSWORD:?run `make env` first}
  # The demo seed writes the demo databases with these (DBPilot itself only ever gets
  # read-only logins; see demo/sql_sources.py and demo/nosql_sources.py).
  DBPILOT_DEMO_SOURCE_PG_ADMIN: postgresql://shop_admin:${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-postgres:5432/shop
  DBPILOT_DEMO_SOURCE_MYSQL_ADMIN: mysql://root:${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-mysql:3306/people
  DBPILOT_DEMO_SOURCE_MSSQL_ADMIN: mssql://sa:${DBPILOT_MSSQL_SA_PASSWORD:?run `make env` first}@source-mssql:1433/inventory
  DBPILOT_DEMO_SOURCE_MONGO_ADMIN: mongodb://catalog_admin:${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-mongo:27017/?authSource=admin
  DBPILOT_DEMO_SOURCE_REDIS_URL: redis://:${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-redis:6379/0

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: dbpilot
      POSTGRES_USER: dbpilot
      POSTGRES_PASSWORD: dbpilot
    ports:
      - "127.0.0.1:${DBPILOT_PG_PORT:-5842}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbpilot -d dbpilot"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate limits, the schema snapshot cache and the dashboard cache. Everything durable
  # lives in Postgres.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${DBPILOT_REDIS_PORT:-5879}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo source: a "shop" PostgreSQL (customers, products, orders) that DBPilot connects to
  # through a read-only login. First class engine.
  source-postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: ${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
    ports:
      - "127.0.0.1:${DBPILOT_SOURCE_PG_PORT:-5843}:5432"
    volumes:
      - sourcepg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo source: a "people" MySQL (departments, employees, leave requests). First class
  # engine.
  source-mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
      MYSQL_DATABASE: people
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    ports:
      - "127.0.0.1:${DBPILOT_SOURCE_MYSQL_PORT:-5806}:3306"
    volumes:
      - sourcemysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Demo source: an "inventory" SQL Server (warehouses, items, stock levels).
  source-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DBPILOT_MSSQL_SA_PASSWORD:?run `make env` first}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${DBPILOT_SOURCE_MSSQL_PORT:-5807}:1433"
    volumes:
      - sourcemssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  # Demo source: a "catalog" MongoDB (products, reviews).
  source-mongo:
    image: mongo:7.0.20
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_admin
      MONGO_INITDB_ROOT_PASSWORD: ${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
    ports:
      - "127.0.0.1:${DBPILOT_SOURCE_MONGO_PORT:-5808}:27017"
    volumes:
      - sourcemongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand(\"ping\")' | mongosh -u catalog_admin -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  # Demo source: a "sessions" Redis (web sessions, carts, rate counters).
  source-redis:
    image: redis:7.4.6-alpine
    environment:
      DBPILOT_SOURCE_ADMIN_PASSWORD: ${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
    command: ["redis-server", "--requirepass", "${DBPILOT_SOURCE_ADMIN_PASSWORD:?run `make env` first}"]
    ports:
      - "127.0.0.1:${DBPILOT_SOURCE_REDIS_PORT:-5809}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DBPILOT_SOURCE_ADMIN_PASSWORD\" ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches mail locally (SMTP 1025, web UI on 5825).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${DBPILOT_MAILPIT_PORT:-5825}:8025"
    restart: unless-stopped

  # A deterministic model provider speaking the OpenAI chat-completions and Anthropic wire
  # formats, so both real provider adapters are exercised against a real HTTP server with
  # no key and no network. The AI assistant only ever generates SELECT statements (AC4); the
  # mock never scripts a write.
  mock-ai:
    build:
      <<: *server-build
      target: api
    image: dbpilot-api:local
    command: ["mockai", "--host", "0.0.0.0", "--port", "5650"]
    ports:
      - "127.0.0.1:${DBPILOT_MOCK_AI_PORT:-5850}:5650"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5650/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: dbpilot-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_started
    restart: "no"

  api:
    image: dbpilot-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${DBPILOT_API_PORT:-5830}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled backups: claims due schedules, runs them through the same backup path a
  # manual backup uses, applies retention, and reaps stale backups/confirmations.
  worker:
    image: dbpilot-api:local
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: dbpilot-web:local
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${DBPILOT_WEB_PORT:-5810}:3000"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  sourcepg:
  sourcemysql:
  sourcemssql:
  sourcemongo:
  objects:
  work:
