openapi: 3.1.0
info:
  title: Euron Open DBPilot
  description: "\nAPI of Euron Open DBPilot, a self-hosted, team-shared database operations dashboard\
    \ for\nPostgreSQL, MySQL, SQLite, SQL Server, MongoDB and Redis.\n\n* Sign in with `POST /api/v1/auth/login`\
    \ and send the session token as\n  `Authorization: Bearer <token>` (the dashboard uses an HttpOnly\
    \ cookie plus the\n  `X-DBP-CSRF: 1` header on changes instead).\n* Connection passwords are sealed\
    \ server side and never returned.\n* Every query runs read-only, enforced by the database itself where\
    \ the engine can, after\n  the SQL guard. AI-generated SQL only ever runs as one read-only query:\
    \ anything else is\n  refused for good.\n* A deliberate write (`POST .../writes`), a migration (`POST\
    \ .../comparisons/{id}/run`) and\n  a restore (`POST .../backups/{id}/restore`) are only described\
    \ at first; they run after a\n  second, separate `POST .../confirmations/{id}/confirm`, audited before\
    \ they run.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
