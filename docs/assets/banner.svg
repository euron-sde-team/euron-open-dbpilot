<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open DBPilot</title>
  <desc id="d">A self-hosted, team-shared database operations dashboard with database-enforced read-only queries</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#0c2236"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#ecfeff" font-size="52" font-weight="650" letter-spacing="-1.2">Euron Open DBPilot</text>
    <text x="74" y="186" fill="#8fb8c7" font-size="21" font-weight="400">A shared cockpit for your team&#8217;s databases, with read-only enforced by the database itself.</text>
    <text x="74" y="246" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5c8595" xml:space="preserve">6 engines<tspan fill="#143042">  /  </tspan>sealed credentials<tspan fill="#143042">  /  </tspan>AI never writes<tspan fill="#143042">  /  </tspan>confirmed writes, audited</text>
  </g>

  <!-- An instrument panel: three gauges, read-only confirmed on each -->
  <g transform="translate(900 50)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11">
    <circle cx="150" cy="110" r="128" fill="url(#halo)"/>

    <!-- gauge 1: a query, guarded -->
    <g transform="translate(16 20)">
      <circle cx="40" cy="40" r="38" fill="#0a2030" stroke="#164a5e" stroke-width="2"/>
      <path d="M40 10 A30 30 0 1 1 11.5 51" fill="none" stroke="url(#dial)" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="36" fill="#a5f3fc" font-size="9" text-anchor="middle">SELECT</text>
      <text x="40" y="49" fill="#5eead4" font-size="9" font-weight="700" text-anchor="middle">guarded</text>
    </g>

    <!-- gauge 2: read-only session -->
    <g transform="translate(116 0)">
      <circle cx="40" cy="40" r="38" fill="#0a2030" stroke="#164a5e" stroke-width="2"/>
      <path d="M40 10 A30 30 0 1 1 13 57" fill="none" stroke="url(#dial)" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="36" fill="#a5f3fc" font-size="9" text-anchor="middle">SESSION</text>
      <text x="40" y="49" fill="#5eead4" font-size="9" font-weight="700" text-anchor="middle">read only</text>
    </g>

    <!-- gauge 3: confirmed write -->
    <g transform="translate(16 120)">
      <circle cx="40" cy="40" r="38" fill="#190f10" stroke="#5e1f24" stroke-width="2"/>
      <path d="M40 10 A30 30 0 1 1 65 62" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="36" fill="#fecdd3" font-size="9" text-anchor="middle">WRITE</text>
      <text x="40" y="49" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">confirmed</text>
    </g>

    <!-- gauge 4: audit -->
    <g transform="translate(116 120)">
      <circle cx="40" cy="40" r="38" fill="#0a2030" stroke="#164a5e" stroke-width="2"/>
      <path d="M40 10 A30 30 0 1 1 10 40" fill="none" stroke="url(#dial)" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="36" fill="#a5f3fc" font-size="9" text-anchor="middle">AUDIT</text>
      <text x="40" y="49" fill="#5eead4" font-size="9" font-weight="700" text-anchor="middle">recorded</text>
    </g>
  </g>
</svg>
