<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="DBPilot architecture: the web app calls the API; the API reads and writes PostgreSQL and talks to Redis; the API's gateway is the only path to a connected database; the worker runs scheduled backups through the same path">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52626a"/></marker>
  </defs>
  <rect width="1100" height="560" rx="18" fill="#f4f7f7"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f1a1c">
    <rect x="40" y="90" width="190" height="70" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="135" y="120" text-anchor="middle" font-weight="600">Web app (Next.js)</text>
    <text x="135" y="140" text-anchor="middle" fill="#52626a" font-size="12">editor, explorer, audit</text>

    <rect x="300" y="90" width="210" height="110" rx="12" fill="#dceefd" stroke="#0e63a8"/>
    <text x="405" y="122" text-anchor="middle" font-weight="700" fill="#0e63a8">API</text>
    <text x="405" y="144" text-anchor="middle" font-size="12">dbpilot serve</text>
    <text x="405" y="162" text-anchor="middle" font-size="12" fill="#52626a">auth, roles, grants</text>
    <text x="405" y="180" text-anchor="middle" font-size="12" fill="#52626a">guard, confirmations, audit</text>
    <path d="M230 125L298 135" stroke="#52626a" fill="none" marker-end="url(#a)"/>

    <rect x="580" y="40" width="220" height="150" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="690" y="68" text-anchor="middle" font-weight="700">PostgreSQL 16</text>
    <text x="690" y="90" text-anchor="middle" font-size="12" fill="#52626a">orgs, projects, connections</text>
    <text x="690" y="108" text-anchor="middle" font-size="12" fill="#52626a">schema snapshots, query runs</text>
    <text x="690" y="126" text-anchor="middle" font-size="12" fill="#52626a">confirmations, backups</text>
    <text x="690" y="144" text-anchor="middle" font-size="12" fill="#52626a">comparisons</text>
    <text x="690" y="162" text-anchor="middle" font-size="12" fill="#52626a">append-only audit log</text>
    <path d="M510 130L578 110" stroke="#52626a" fill="none" marker-end="url(#a)"/>

    <rect x="870" y="40" width="190" height="64" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="965" y="68" text-anchor="middle" font-weight="600">Redis 7</text>
    <text x="965" y="86" text-anchor="middle" font-size="12" fill="#52626a">schema/health/dashboard caches</text>
    <rect x="870" y="126" width="190" height="64" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="965" y="154" text-anchor="middle" font-weight="600">S3 and KMS</text>
    <text x="965" y="172" text-anchor="middle" font-size="12" fill="#52626a">backups, SQLite files, sealing</text>
    <path d="M800 92L868 72" stroke="#52626a" fill="none" marker-end="url(#a)"/>
    <path d="M800 150L868 158" stroke="#52626a" fill="none" marker-end="url(#a)"/>

    <rect x="300" y="290" width="210" height="96" rx="12" fill="#dceefd" stroke="#0e63a8"/>
    <text x="405" y="320" text-anchor="middle" font-weight="700" fill="#0e63a8">The gateway</text>
    <text x="405" y="342" text-anchor="middle" font-size="12">connections/gateway.py</text>
    <text x="405" y="360" text-anchor="middle" font-size="12" fill="#52626a">the ONE path to a customer DB</text>
    <path d="M405 200L405 288" stroke="#52626a" fill="none" marker-end="url(#a)"/>
    <text x="420" y="248" font-size="11.5" fill="#52626a">every query, read or confirmed write</text>

    <rect x="300" y="420" width="210" height="80" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="405" y="448" text-anchor="middle" font-weight="600">Worker</text>
    <text x="405" y="470" text-anchor="middle" font-size="12" fill="#52626a">dbpilot worker: scheduled backups,</text>
    <text x="405" y="486" text-anchor="middle" font-size="12" fill="#52626a">confirmation expiry</text>
    <path d="M405 386L405 418" stroke="#52626a" fill="none" marker-end="url(#a)"/>

    <rect x="580" y="290" width="470" height="200" rx="12" fill="#ffffff" stroke="#dfe7e8"/>
    <text x="815" y="318" text-anchor="middle" font-weight="700">Connected databases (your team's own)</text>
    <g font-size="12" fill="#52626a">
      <rect x="600" y="336" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="665" y="361" text-anchor="middle">PostgreSQL</text>
      <rect x="740" y="336" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="805" y="361" text-anchor="middle">MySQL</text>
      <rect x="880" y="336" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="945" y="361" text-anchor="middle">SQL Server</text>
      <rect x="600" y="386" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="665" y="411" text-anchor="middle">SQLite</text>
      <rect x="740" y="386" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="805" y="411" text-anchor="middle">MongoDB</text>
      <rect x="880" y="386" width="130" height="40" rx="8" fill="#f4f7f7" stroke="#dfe7e8"/>
      <text x="945" y="411" text-anchor="middle">Redis</text>
    </g>
    <text x="815" y="450" text-anchor="middle" font-size="12" fill="#52626a">opened read-only wherever the engine supports it (AC3)</text>
    <path d="M510 360L578 360" stroke="#52626a" fill="none" marker-end="url(#a)"/>
  </g>
</svg>
